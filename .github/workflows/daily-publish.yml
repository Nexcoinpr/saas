name: Automated Article Publishing (8 Articles/Day, Every 3 Hours)

on:
  schedule:
    # Runs every 3 hours (24 / 8 = every 3 hours: 00:00, 03:00, 06:00, 09:00, 12:00, 15:00, 18:00, 21:00 UTC)
    - cron: '0 */3 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to publish (default 1 per 3h run, or enter 8 for full day)'
        required: true
        default: '1'
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Publish Article Across Rotating Categories
        run: |
          COUNT="${{ github.event.inputs.count || '1' }}"
          node scripts/publish-daily.js --count "$COUNT"

      - name: Verify Clean Word Checklist
        run: node scripts/clean-check.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "SaaSInsider Bot"
          git config --global user.email "bot@saasinsider.com"
          git add src/data/published-articles.json data/publishing-state.json data/keywords/article-roadmap-master.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "chore(content): auto-publish article across rotating categories [skip ci]"
            git push origin main
          fi
