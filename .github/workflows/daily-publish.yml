name: Daily Article Publishing Automation

on:
  schedule:
    # Runs every day at 06:00 UTC (11:00 AM PKT)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of articles to publish'
        required: true
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Publish Daily Articles
        run: |
          COUNT="${{ github.event.inputs.count || '3' }}"
          node scripts/publish-daily.js --count "$COUNT"

      - name: Verify Clean Word Checklist
        run: node scripts/clean-check.js

      - name: Commit and Push Changes
        run: |
          git config --global user.name "SaaSInsider Bot"
          git config --global user.email "bot@saasinsider.com"
          git add src/data/published-articles.json data/publishing-state.json data/keywords/article-roadmap-master.json
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No new articles to commit."
          else
            git commit -m "chore(content): auto-publish daily articles [skip ci]"
            git push origin main
          fi
