<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1020" />
      <stop offset="50%" stop-color="#070b14" />
      <stop offset="100%" stop-color="#04060a" />
    </linearGradient>

    <!-- Vibrant Cyan to Royal Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Screen Glass Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080e1a" />
    </linearGradient>

    <!-- Cable Glow Gradient -->
    <linearGradient id="cableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Connector Metal Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Soft Ambient Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Canvas Base -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#primaryGrad)" stroke-width="2.5" stroke-opacity="0.4" />

  <!-- Monitor Stand Base -->
  <path d="M 216 384 L 296 384 L 308 408 L 204 408 Z" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="2" />
  <rect x="176" y="404" width="160" height="12" rx="6" fill="#0f172a" stroke="#334155" stroke-width="2" />

  <!-- Monitor Neck -->
  <rect x="240" y="324" width="32" height="64" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1.5" />

  <!-- Monitor Body Outer Bezel -->
  <rect x="80" y="96" width="352" height="236" rx="26" fill="#0b1120" stroke="#334155" stroke-width="3" />
  
  <!-- Monitor Inner Screen Display -->
  <rect x="96" y="112" width="320" height="204" rx="18" fill="url(#screenGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Screen Top Bar / Window Controls -->
  <circle cx="120" cy="130" r="5" fill="#ef4444" opacity="0.8" />
  <circle cx="136" cy="130" r="5" fill="#f59e0b" opacity="0.8" />
  <circle cx="152" cy="130" r="5" fill="#10b981" opacity="0.8" />
  <line x1="96" y1="144" x2="416" y2="144" stroke="#1e293b" stroke-width="1.5" />

  <!-- Central Cloud Software Symbol Inside Screen -->
  <g transform="translate(180, 160)">
    <!-- Cloud base silhouette with gradient glow -->
    <path d="M 38 72 
             L 114 72 
             A 22 22 0 0 0 120 28 
             A 30 30 0 0 0 66 18 
             A 26 26 0 0 0 38 46 
             A 20 20 0 0 0 38 72 Z" 
          fill="url(#primaryGrad)" 
          opacity="0.25" 
          filter="url(#glow)" />
    <path d="M 38 72 
             L 114 72 
             A 22 22 0 0 0 120 28 
             A 30 30 0 0 0 66 18 
             A 26 26 0 0 0 38 46 
             A 20 20 0 0 0 38 72 Z" 
          fill="none" 
          stroke="url(#primaryGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" />

    <!-- Stylized 'S' inside Cloud -->
    <path d="M 88 38 
             C 84 32, 70 32, 68 39 
             C 66 45, 84 48, 84 56 
             C 84 64, 70 64, 64 58" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>

  <!-- Wrapping Interconnected Tech Cable with USB / Data Connector -->
  <!-- Cable Shadow -->
  <path d="M 88 180 
           C 52 180, 48 340, 120 376 
           C 200 416, 290 400, 340 370 
           C 400 334, 440 280, 424 210 
           C 410 148, 350 144, 330 180 
           C 310 220, 330 280, 380 300 
           C 410 312, 420 360, 390 390 
           L 364 416" 
        fill="none" 
        stroke="#040711" 
        stroke-width="26" 
        stroke-linecap="round" 
        opacity="0.7" />

  <!-- Glowing Cable Body -->
  <path d="M 88 180 
           C 52 180, 48 340, 120 376 
           C 200 416, 290 400, 340 370 
           C 400 334, 440 280, 424 210 
           C 410 148, 350 144, 330 180 
           C 310 220, 330 280, 380 300 
           C 410 312, 420 360, 390 390 
           L 364 416" 
        fill="none" 
        stroke="url(#cableGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        filter="url(#glow)" />

  <path d="M 88 180 
           C 52 180, 48 340, 120 376 
           C 200 416, 290 400, 340 370 
           C 400 334, 440 280, 424 210 
           C 410 148, 350 144, 330 180 
           C 310 220, 330 280, 380 300 
           C 410 312, 420 360, 390 390 
           L 364 416" 
        fill="none" 
        stroke="#e0f2fe" 
        stroke-width="5" 
        stroke-linecap="round" 
        opacity="0.85" />

  <!-- USB Plug Collar -->
  <g transform="translate(364, 416) rotate(-45)">
    <!-- Rubber Strain Relief -->
    <rect x="-14" y="0" width="28" height="12" rx="4" fill="#0284c7" />
    <!-- Connector Body -->
    <rect x="-16" y="12" width="32" height="36" rx="6" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <!-- Center Grip Indentation -->
    <circle cx="0" cy="30" r="5" fill="#0c4a6e" />
    <!-- Metal Plug Head -->
    <rect x="-12" y="48" width="24" height="26" rx="2" fill="url(#metalGrad)" stroke="#64748b" stroke-width="1.5" />
    <!-- Pin Windows -->
    <rect x="-8" y="54" width="5" height="8" rx="1" fill="#1e293b" />
    <rect x="3" y="54" width="5" height="8" rx="1" fill="#1e293b" />
  </g>

</svg>
